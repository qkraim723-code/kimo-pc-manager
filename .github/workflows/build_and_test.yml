name: Build and Test Kimo PC Manager

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run automated test suite
      run: |
        pytest -v

    - name: Generate app icons
      run: |
        python assets/generate_icon.py

    - name: Build Windows Executable
      run: |
        pyinstaller --noconfirm --onedir --windowed --name "KimoPCManager" --icon "assets/icon.ico" --add-data "locales;locales" --add-data "assets;assets" main.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: KimoPCManager-Windows-x64
        path: dist/KimoPCManager/
